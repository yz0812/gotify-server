name: Build server-arm64
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  server-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: yarn --cwd ui install --frozen-lockfile
      - run: make build-js
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ARM64 image
        run: |
          docker buildx build --push --platform linux/arm64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --build-arg "GO_VERSION=$(cat GO_VERSION)" \
            --build-arg "LD_FLAGS=-w -s -X main.Version=master-${GITHUB_SHA:0:7} -X main.BuildDate=$(date -u +%F-%T) -X main.Commit=$GITHUB_SHA -X main.Mode=prod" \
            -t "ghcr.io/$GITHUB_REPOSITORY_OWNER/server-arm64:$GITHUB_SHA" \
            -t "ghcr.io/$GITHUB_REPOSITORY_OWNER/server-arm64:latest" \
            -f docker/Dockerfile .
